global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: sentinelai-api
    metrics_path: /api/v1/metrics
    scrape_timeout: 5s
    authorization:
      type: Bearer
      credentials_file: /run/metrics-secrets/metrics_token
    static_configs:
      - targets: ["backend:8000"]
