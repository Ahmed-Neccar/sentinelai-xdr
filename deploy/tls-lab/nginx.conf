# Lab HTTPS front for https://localhost:8443 (Compose profile "tls-lab").
# It terminates TLS with a self-signed certificate and forwards everything to
# the normal frontend container. Not a production configuration.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
  worker_connections 256;
}

http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/tls/localhost.crt;
    ssl_certificate_key /etc/nginx/tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 11m;
    # No HSTS: it would apply to every port on "localhost" in this browser.

    location / {
      proxy_pass http://frontend:8080;
      proxy_set_header Host $http_host;
      # Overwrite, never append: this proxy is the only trusted hop.
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
