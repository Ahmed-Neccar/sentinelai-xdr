[project]
name = "sentinelai-xdr"
version = "0.1.0"
description = "Local defensive security monitoring platform"
requires-python = ">=3.12,<3.14"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"app/api/v1/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
packages = ["app"]
