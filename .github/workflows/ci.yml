name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sentinel_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://sentinel:ci-only-password@127.0.0.1:5432/sentinel_test
      TENANT_TEST_DATABASE_URL: postgresql+psycopg://sentinel_runtime:ci-app-password@127.0.0.1:5432/sentinel_test
      POSTGRES_APP_PASSWORD: ci-app-password
      SECRET_KEY: ci-only-signing-key-that-is-long-enough
      SENTINEL_ENV: development
      SENTINEL_JOB_RUNNER: inline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install --require-hashes --requirement requirements.lock
      - name: Validate database migrations
        run: alembic upgrade head
      - name: Provision least-privilege database roles
        run: PGPASSWORD=ci-only-password psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sentinel -d sentinel_test -v app_password="$POSTGRES_APP_PASSWORD" -v migrator_password=ci-migrator-password -f provision_runtime_role.sql
      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+psycopg://sentinel_runtime:ci-app-password@127.0.0.1:5432/sentinel_test
          MFA_TEST_DATABASE_URL: postgresql+psycopg://sentinel_runtime:ci-app-password@127.0.0.1:5432/sentinel_test
        run: python -m pytest --cov=app --cov-report=term-missing
      - name: Install sensor dependencies
        # The sensor imports scapy, which the backend lock does not contain.
        run: python -m pip install --requirement ../sensor/requirements.txt
      - name: Run Windows sensor parser tests
        run: PYTHONPATH=.. python -m pytest ../sensor/tests
      - name: Lint backend
        run: python -m ruff check app tests
      - name: Check backend types
        run: python -m mypy app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
